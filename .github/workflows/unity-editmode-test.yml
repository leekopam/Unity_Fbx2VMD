name: Unity EditMode Tests

on:
  workflow_dispatch:
  # push / pull_request 트리거는 UNITY_LICENSE secret 확인 및 수동 실행 성공 후 추가한다

permissions:
  checks: write
  contents: read

jobs:
  editmode-test:
    name: EditMode Tests (Unity 2022.3)
    runs-on: ubuntu-latest
    # FBX 파일은 gitignore 처리되어 CI에 없으므로 PlayMode/Smoke 테스트는 제외한다.
    # EditMode 전용 테스트만 실행한다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false  # FBX/VMD는 gitignore 처리됨

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          testMode: editMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # 손가락 근육 클램핑, VMD 명명 계약 등 FBX 없이 실행 가능한 테스트만 포함
          # PlayMode/Smoke 테스트는 FBX가 필요하므로 로컬에서만 실행한다

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-Test-Results
          path: test-results
          retention-days: 14
